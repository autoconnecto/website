# Deploy static export (out/) to S3 + CloudFront invalidation.
#
# Required repository SECRETS (Settings → Secrets and variables → Actions → Secrets):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#
# Bucket + distribution ID are not secret — set via Secrets OR Variables OR use
# production defaults below. If sync failed with empty WEBSITE_S3_BUCKET, you likely
# added values under the Variables tab but named them as secrets (or vice versa).
#
# Optional overrides (Secrets or Variables, same names):
#   WEBSITE_S3_BUCKET                  default: autoconnecto-www-site
#   WEBSITE_CLOUDFRONT_DISTRIBUTION_ID default: E3UPPLM5N2GQ5Z
#
# IAM: customer-managed policy AutoconnectoWebsiteDeploy on autoconnecto-backend.

name: Website — deploy static export to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WEBSITE_S3_BUCKET: ${{ secrets.WEBSITE_S3_BUCKET || vars.WEBSITE_S3_BUCKET || 'autoconnecto-www-site' }}
  WEBSITE_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.WEBSITE_CLOUDFRONT_DISTRIBUTION_ID || vars.WEBSITE_CLOUDFRONT_DISTRIBUTION_ID || 'E3UPPLM5N2GQ5Z' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_LEAD_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_LEAD_WEBHOOK_URL }}
          NEXT_PUBLIC_LEADS_EMAIL: ${{ vars.NEXT_PUBLIC_LEADS_EMAIL }}
        run: |
          export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://www.autoconnecto.in}"
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync to S3
        run: |
          echo "Target bucket: ${WEBSITE_S3_BUCKET}"
          test -n "${WEBSITE_S3_BUCKET}"
          aws s3 sync out/ "s3://${WEBSITE_S3_BUCKET}/" --delete --region ap-south-1

      - name: Invalidate CloudFront
        run: |
          echo "CloudFront distribution: ${WEBSITE_CLOUDFRONT_DISTRIBUTION_ID}"
          aws cloudfront create-invalidation \
            --distribution-id "${WEBSITE_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
